services:
  java-chains:
    image: javachains/javachains:latest
    container_name: java-chains
    restart: always
    ports:
      - "8011:8011"
      - "58080:58080"
      - "50389:50389"
      - "50388:50388"
      - "3308:3308"
      - "13999:13999"
      - "50000:50000"
      - "11527:11527"
    environment:
      - CHAINS_AUTH=true
      - CHAINS_PASS=
    tmpfs:
      - /tmp:exec
